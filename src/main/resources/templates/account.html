<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraCloud Spring</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body th:classappend="${session.theme != null ? session.theme : 'dark-theme'}">
<header>
    <div th:replace="~{fragments/header :: mainHead}"></div>
    <div th:replace="~{fragments/header :: mainNav}"></div>
</header>
<main>
    <div class="account-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 th:text="|Witaj, ${username}|" style="margin: 0;">Panel główny</h2>

        <div class="admin-actions" sec:authorize="hasRole('ADMIN')">
            <a href="/admin/dashboard" class="btn-admin" style="
                background-color: #d97706;
                color: white;
                text-decoration: none;
                padding: 10px 15px;
                border-radius: 5px;
                font-weight: bold;
                display: inline-block;
                transition: background 0.2s;">
                Panel Administratora
            </a>
        </div>
    </div>

    <div class="storage-container" style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px;">
        <span class="white">
            <strong id="storagePlanName">Plan: Ładowanie...</strong>
            (<span id="storageText">0 MB / 0 MB</span>)
        </span>
            <strong id="storagePercent" style="color: #4caf50;">0%</strong>
        </div>
        <div style="width: 100%; background: #333; border-radius: 5px; height: 12px; overflow: hidden;">
            <div id="storageBar" style="width: 0%; height: 100%; background: #4caf50; transition: width 0.4s ease, background-color 0.4s ease;"></div>
        </div>
    </div>

    <div class="container">
        <div class="uploaderDialog">
            <h2>Wyślij plik</h2>
            <input type="file" id="fileInput">
            <h6 id="maxupload">Maksymalny rozmiar: 500MB</h6>
            <button id="uploadButton">Wyślij</button>
            <span id="uploadBar"></span>
            <span id="status"></span>
        </div>
        <div class="filelistDialog">
            <h2>Lista plików</h2>
            <div class="flcontainer">
                <div class="flheader">
                    <span class="white"><strong>Sortuj:</strong></span>
                    <span id="asc"> rosnąco </span>
                    <span id="desc"> malejąco </span>
                    <button id="createFolderBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-folder-plus" viewBox="0 0 16 16">
                            <path d="m.5 3 .04.87a2 2 0 0 0-.342 1.311l.637 7A2 2 0 0 0 2.826 14H9v-1H2.826a1 1 0 0 1-.995-.91l-.637-7A1 1 0 0 1 2.19 4h11.62a1 1 0 0 1 .996 1.09L14.54 8h1.005l.256-2.819A2 2 0 0 0 13.81 3H9.828a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 6.172 1H2.5a2 2 0 0 0-2 2m5.672-1a1 1 0 0 1 .707.293L7.586 3H2.19q-.362.002-.683.12L1.5 2.98a1 1 0 0 1 1-.98z"/>
                            <path d="M13.5 9a.5.5 0 0 1 .5.5V11h1.5a.5.5 0 1 1 0 1H14v1.5a.5.5 0 1 1-1 0V12h-1.5a.5.5 0 0 1 0-1H13V9.5a.5.5 0 0 1 .5-.5"/>
                        </svg>
                    </button>
                    <br><br>
                    <span class="white"><strong>Szukaj: </strong></span>
                    <form id="sForm">
                        <input type="text" name="search" id="searchInput" placeholder="nazwa...">
                    </form>
                </div>
                <div class="filelist"></div>
            </div>
        </div>
    </div>
</main>
<footer>
    <p th:replace="~{fragments/footer :: version}"></p>
</footer>

<script src="/assets/js/account.js"></script>
</body>
</html>
