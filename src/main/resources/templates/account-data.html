<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraCloud Spring</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body th:classappend="${session.theme != null ? session.theme : 'dark-theme'}">
<header>
    <div th:replace="~{fragments/header :: mainHead}"></div>
    <div th:replace="~{fragments/header :: mainNav}"></div>
</header>
<main>
    <div class="profile-container">
        <h2>Dane konta</h2>
        <div class="profile-info-card">

            <div class="info-row">
                <div class="info-meta">
                    <span class="info-label">Nazwa użytkownika:</span>
                    <span class="info-value text-muted" th:text="${loggedUser.username}">Nazwa Użytkownika</span>
                </div>
                <div class="info-action-placeholder"></div>
            </div>

            <hr class="profile-divider">

            <div class="info-row" id="email-row-container">
                <div class="info-meta" id="email-view-mode">
                    <span class="info-label">Adres e-mail</span>
                    <span class="info-value" th:text="${loggedUser.email}">user@astracloud.pl</span>
                </div>
                <div class="info-action" id="email-view-btn">
                    <button type="button" class="btn-change" onclick="enableEmailEdit()">Zmień e-mail</button>
                </div>

                <form th:action="@{/account-data/update-email}" method="POST" id="email-edit-mode" style="display: none; width: 100%;">
                    <div class="edit-group">
                        <div class="info-meta" style="flex: 1;">
                            <label for="email-input" class="info-label">Nowy adres e-mail</label>
                            <input type="email" id="email-input" name="newEmail" class="form-input" th:value="${loggedUser.email}" required />
                        </div>
                        <div class="edit-actions">
                            <button type="submit" class="btn-save">Zapisz</button>
                            <button type="button" class="btn-cancel" onclick="cancelEmail()">Anuluj</button>
                        </div>
                    </div>
                </form>
            </div>

            <hr class="profile-divider">

            <div class="info-row" id="password-row-container">
                <div class="info-meta" id="password-view-mode">
                    <span class="info-label">Hasło</span>
                    <span class="info-value password-dots">••••••••</span>
                </div>
                <div class="info-action" id="password-view-btn">
                    <button type="button" class="btn-change" onclick="showPasswordForm()">Zmień hasło</button>
                </div>

                <div id="password-form" style="display:none; width: 100%;">
                    <div class="edit-group password-edit-group">
                        <div class="info-meta" style="flex: 1; gap: 0.5rem;">
                            <label class="info-label">Zmiana hasła</label>
                            <input type="password" id="oldPassword" name="oldPassword" class="form-input" placeholder="Stare hasło" required>
                            <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="Nowe hasło" required>
                        </div>
                        <div class="edit-actions">
                            <button type="button" class="btn-save" onclick="submitPasswordChange()">Zapisz</button>
                            <button type="button" class="btn-cancel" onclick="hidePasswordForm()">Anuluj</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function enableEmailEdit() {
            document.getElementById('email-view-mode').style.display = 'none';
            document.getElementById('email-view-btn').style.display = 'none';
            document.getElementById('email-edit-mode').style.display = 'block';
            document.getElementById('email-input').focus();
        }

        function cancelEmail() {
            document.getElementById('email-edit-mode').style.display = 'none';
            document.getElementById('email-view-mode').style.display = 'flex';
            document.getElementById('email-view-btn').style.display = 'block';
            document.getElementById('email-input').value = document.querySelector('#email-view-mode .info-value').innerText;
        }

        function showPasswordForm() {
            document.getElementById('password-view-mode').style.display = 'none';
            document.getElementById('password-view-btn').style.display = 'none';
            document.getElementById('password-form').style.display = 'block';
            document.getElementById('oldPassword').focus();
        }

        function hidePasswordForm() {
            document.getElementById('password-form').style.display = 'none';
            document.getElementById('password-view-mode').style.display = 'flex';
            document.getElementById('password-view-btn').style.display = 'block';
            document.getElementById('oldPassword').value = "";
            document.getElementById('newPassword').value = "";
        }

        function submitPasswordChange() {
            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;

            if(!oldPassword || !newPassword) {
                alert("Wypełnij oba pola haseł!");
                return;
            }

            const headers = {
                "Content-Type": "application/json"
            };

            fetch("/api/account/password", {
                method: "POST",
                headers: headers,
                body: JSON.stringify({
                    oldPassword: oldPassword,
                    newPassword: newPassword
                })
            })
                .then(async res => {
                    if (res.ok) {
                        alert("Hasło zostało pomyślnie zmienione.");
                        location.reload();
                    } else {
                        const msg = await res.text();
                        alert("Błąd: " + msg);
                    }
                });
        }
    </script>
</main>
<footer>
    <p th:replace="~{fragments/footer :: version}"></p>
</footer>
</body>
</html>
