<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraCloud Spring</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body th:classappend="${session.theme != null ? session.theme : 'dark-theme'}">
<header>
    <div th:replace="~{fragments/header :: mainHead}"></div>
    <div th:replace="~{fragments/header :: mainNav}"></div>
</header>
<main>
    <h2>Panel administratora</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Użytkownik</th>
            <th>Email</th>
            <th>Rola</th>
            <th>Subskrypcja (Limit)</th>
            <th>Pliki wgrane</th>
            <th>Zużycie pamięci</th>
            <th>Akcje</th>
            <th>Usuwanie</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usersList}" th:id="'user-row-' + ${u.id}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">user</td>
            <td th:text="${u.email}">user@test.pl</td>
            <td th:text="${u.role}">ROLE_USER</td>
            <td><span th:text="${u.subscription}">FREE</span></td>
            <td th:text="${u.fileCount}">0</td>
            <td><span th:text="${u.storageUsage}">0.00</span> MB</td>
            <td>
                <button type="button" th:data-id="${u.id}" th:data-username="${u.username}" th:data-email="${u.email}" th:data-subscription="${u.subscription}" onclick="openEditModal(this)">
                    Edytuj
                </button>
            </td>
            <td>
                <button type="button" th:onclick="'deleteUser(' + ${u.id} + ')'">Usuń konto</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div id="editModal" style="display: none;">
        <div>
            <div>
                <h3>Edycja użytkownika: <span id="modal-username-title"></span></h3>
                <span onclick="closeModal()">&times;</span>
            </div>

            <form onsubmit="submitAdminEdit(event)">
                <input type="hidden" id="modal-user-id">

                <div>
                    <label for="modal-email">Adres E-mail</label>
                    <input type="email" id="modal-email" class="form-input" required>
                </div>

                <div>
                    <label for="modal-subscription">Pakiet subskrypcji</label>
                    <select id="modal-subscription" class="form-input">
                        <option value="FREE">FREE</option>
                        <option value="PREMIUM">PREMIUM</option>
                        <option value="ENTERPRISE">ENTERPRISE</option>
                    </select>
                </div>

                <div>
                    <label for="modal-password">Nowe hasło (Zostaw puste, jeśli bez zmian)</label>
                    <input type="password" id="modal-password" class="form-input" placeholder="Wpisz nowe hasło użytkownika...">
                </div>

                <div>
                    <button type="button" onclick="closeModal()">Anuluj</button>
                    <button type="submit">Zapisz zmiany</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    // Funkcja pomocnicza do pobierania tokenu CSRF z tagów meta
    function getCsrfConfig() {
        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        return { token, header };
    }

    function openEditModal(button) {
        const id = button.getAttribute('data-id');
        const username = button.getAttribute('data-username');
        const email = button.getAttribute('data-email');
        const subscription = button.getAttribute('data-subscription');

        document.getElementById('modal-user-id').value = id;
        document.getElementById('modal-username-title').innerText = username;
        document.getElementById('modal-email').value = email;
        document.getElementById('modal-subscription').value = subscription;
        document.getElementById('modal-password').value = '';

        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function submitAdminEdit(event) {
        event.preventDefault();

        const userId = document.getElementById('modal-user-id').value;
        const email = document.getElementById('modal-email').value;
        const subscription = document.getElementById('modal-subscription').value;
        const password = document.getElementById('modal-password').value;

        // Pobieramy nagłówki CSRF
        const csrf = getCsrfConfig();

        fetch("/admin/api/users/" + userId, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                [csrf.header]: csrf.token // WSTRZYKNIĘCIE TOKENU CSRF
            },
            body: JSON.stringify({
                email: email,
                subscription: subscription,
                password: password
            })
        })
            .then(async res => {
                if (res.ok) {
                    alert("Dane użytkownika zostały zaktualizowane!");
                    location.reload();
                } else {
                    const msg = await res.text();
                    alert("Błąd: " + msg);
                }
            });
    }

    function deleteUser(userId) {
        if (confirm("Czy na pewno chcesz bezpowrotnie usunąć tego użytkownika i wszystkie jego pliki?")) {
            // Pobieramy nagłówki CSRF
            const csrf = getCsrfConfig();

            fetch("/admin/api/users/" + userId, {
                method: "DELETE",
                headers: {
                    [csrf.header]: csrf.token // WSTRZYKNIĘCIE TOKENU CSRF przy DELETE
                }
            })
                .then(res => {
                    if (res.ok) {
                        // zajebisty ten kod taki że nie działa
                        // document.getElementById('user-row-' + userId).remove();
                        const row = document.getElementById('user-row-' + userId);
                        if(row) row.remove();

                        alert("Użytkownik został usunięty.");
                    } else {
                        alert("Nie udało się usunąć użytkownika.");
                    }
                });
        }
    }
</script>
</body>
</html>
