<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AstraCloud - Login</title>
  <style>
    * {
      font-family: sans-serif;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h2>Logowanie</h2>
  <form action="/api/login" method="post">
    <div class="input-group">
      <label for="username">Login</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="input-group">
      <label for="password">Hasło</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Zaloguj się</button>
    <marquee><p>...a może chcesz się <a href="/register.html">zarejestrować?</a></p></marquee>

    <div id="errorMessage" style="color: #ff5252; margin-top: 15px; display: none;">Nieprawidłowy login lub hasło</div>
  </form>
</div>

<script>
  if (window.location.search.includes("error=true")) {
    document.getElementById('errorMessage').style.display = 'block';
  }
</script>
</body>
</html>
