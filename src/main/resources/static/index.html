<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>AstraCloud Spring</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .upload-container, .filelist { margin-top: 20px; }
        .listItem { background: #333; padding: 10px; margin: 5px 0; border-radius: 5px; }
        a { color: #00bcd4; text-decoration: none; }
        button { padding: 5px 10px; margin-left: 10px; color: white; background-color: #444444; border: none; border-radius: 5px;}
        #uploadBar { background: #00bcd4; transition: width 0.3s; }
        .filelist { background-color: dimgray; border-radius: 10px; padding: 10px; }
        .upload-container, .sort-container { background-color: dimgray; padding: 10px; width: fit-content; border-radius: 10px; }
    </style>
</head>
<body>
<h1>AstraCloud</h1>

<div class="sort-container">
    <p>sortuj i filtruj</p>
    <button id="asc">rosnąco</button>
    <button id="desc">malejąco</button>
    <input type="text" id="searchInput" placeholder="Szukaj pliku...">
</div>

<div class="upload-container">
    <p>prześlij plik!</p>
    <input type="file" id="fileInput">
    <button id="uploadButton" style="background-color: purple; color: white; width: 76px;">Wyślij</button>
    <div style="width: 100%; background: #444; margin-top: 5px;">
        <div id="uploadBar" style="height: 0px; width: 0%;"></div>
    </div>
</div>

<div class="filelist"></div>

<script>

    const ascObj = document.getElementById('asc');
    const descObj = document.getElementById('desc');

    const uploadBtn = document.getElementById('uploadButton');
    const uploadForm = document.getElementById('fileInput');
    const uploadBar = document.getElementById('uploadBar');

    const searchInput = document.getElementById('searchInput');
    const searchForm = document.getElementById('sForm');

    let user = null;
    let fileList = [];
    let sortMode = 0;
    let uploading = 0;

    // Pobranie aktualnie zalogowanego użytkownika z backendu
    fetch('/api/me')
        .then(res => {
            if (!res.ok) {
                window.location.href = '/login.html';
                throw new Error("Brak sesji");
            }
            return res.json();
        })
        .then(data => {
            user = data.login;
            fetchList();
        })
        .catch(err => console.error(err));

    function fetchList() {
        if (!user) return;
        const fetchUrl = '/api/files/'+user;
        fetch(fetchUrl)
            .then(res => res.json())
            .then(files => {
                fileList = files;
                fileList = sortList(fileList, sortMode);
                buildList(fileList);
            });
    }

    // uploadowanie
    function uploadFile() {
        const file = uploadForm.files[0];
        if (!file) return;

        console.log("Rozpoczynam przesyłanie...");
        uploading = 1;

        // zmieńmy to na fetch w wolnej chwili
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');

        uploadBar.style.height = '5px';
        uploadBar.style.width = 0;
        uploadBtn.style.backgroundColor = 'gray';
        uploadBtn.style.width = '110.5px';

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                uploadBar.style.width = (percentComplete-10) + '%';
            }
        };

        xhr.onload = function() {
            if (xhr.status == 200) {
                fetchList();
                buildList(sortList(fileList, 0));
                uploadBtn.innerHTML = 'Przesłano!';
                uploadBtn.style.backgroundColor = 'green';
                uploadBar.style.height = 0;
                setTimeout(() => {
                    uploadBtn.innerHTML = 'Wyślij';
                    uploadBtn.style.backgroundColor = 'purple';
                    uploadBtn.style.width = '76px';
                    uploadForm.value = null;
                    uploading = 0;
                }, 1000)
            } else {
                uploadBtn.innerHTML = 'Błąd!';
                uploadBtn.style.backgroundColor = 'red';
                uploadBtn.style.width = '76px';
                uploadBar.style.height = 0;
                console.log("Błąd przesyłania: "+xhr.status);
                uploadForm.value = null;
                uploading = 0;
            }
        };

        xhr.onerror = function() {
            uploadBtn.innerHTML = 'Błąd!';
            uploadBtn.style.backgroundColor = 'red';
            uploadBtn.style.width = '76px';
            uploadBar.style.height = 0;
            console.log("Błąd przesyłania: błąd sieci");
            uploadForm.value = null;
            uploading = 0;
        }

        const formData = new FormData();
        formData.append('file', file);
        xhr.send(formData);
    }

    // usuwanie!
    function deleteFile(fileId, button) {
        if (!confirm("Na pewno tępy chuju?")) return;
        console.log("Usuwam ID " + fileId);
        //backend sprawdza poprawność tokenu i wychwyca śmieszne ../
        fetch('/api/delete', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id: fileId })
        })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'ok') {
                    button.closest('.listItem').remove();
                } else {
                    console.log("Błąd usuwania " + result.message);
                    alert('Błąd: ' + result.message);
                }
            });
    }

    // lista plikow, budowanie html
    function buildList(fileList) {
        const flDiv = document.querySelector('.filelist');
        flDiv.innerHTML = "<h1>Wczytywanie...</h1>";
        //dla kazdego pliku generujemy div'a
        const html = fileList.map(file => {
            const readable = new Date(file.date * 1000).toLocaleString();
            return `
	<span id="chdate">Data modyfikacji: ${readable}</span>
        <div class="listItem" data-id="${file.id}">
            <a href="/uploads/${user}/${file.name}">${file.name} </a>
	    <button class="deleteButton" data-id="${file.id}">Usuń</button>
        </div>
        `
        }).join('');
        flDiv.innerHTML = `${html}`;

        //dodajemy eventy dla kazdego przycisku usuwania
        document.querySelectorAll('.deleteButton').forEach(button => {
            button.addEventListener('click', () => {
                const id = button.dataset.id;
                deleteFile(id, button);
            });
        });
    }

    // sortowanie
    function sortList(fileList, sortMode) {
        const newlist = fileList.slice();

        //sortowanie rosnąco edycja javascript
        function asc(a, b) {
            if (a.name < b.name) return -1;
            if (a.name > b.name) return 1;
            return 0;
        }

        //sortowanie malejąco edycja javascript
        function desc(a, b) {
            if (a.name > b.name) return -1;
            if (a.name < b.name) return 1;
            return 0;
        }

        //oczywiste
        switch (sortMode) {
            case 0:
                newlist.sort(asc);
                ascObj.style.color = 'white';
                descObj.style.color = 'grey';
                break;
            case 1:
                newlist.sort(desc);
                ascObj.style.color = 'grey';
                descObj.style.color = 'white';
                break;
        }
        return newlist;
    }

    function searchList(searchString) {
        //backend sprawdza poprawność tokenu i usera zakodowanego w tokenie
        fetch(`/api/search?search=${encodeURIComponent(searchString)}`)
            .then(res => res.json())
            .then(files => {
                fileList = files;
                //sortujemy i budujemy div
                fileList = sortList(fileList, sortMode);
                buildList(fileList);
            })
        return fileList;
    }

    // main
    fetchList();

    // eventy rozmaite
    uploadBtn.addEventListener('click', () => {
        if (!uploading && document.getElementById('fileInput').files[0] != undefined) {
            uploadFile();
            uploadBtn.innerHTML = 'Przesyłanie...';
        }
    });
    ascObj.addEventListener('click', () => {
        buildList(sortList(fileList, 0));
    })
    descObj.addEventListener('click', () => {
        buildList(sortList(fileList, 1));
    })
    // searchForm.addEventListener('input', function(event) {
    //     event.preventDefault();
    //     console.log("Search: "+searchInput.value);
    //     buildList(searchList(searchInput.value));
    // });
    searchInput.addEventListener('input', function(event) {
        console.log("Search: " + searchInput.value);
        buildList(searchList(searchInput.value));
    });
</script>
</body>
</html>
